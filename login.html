<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LexAI — Connexion</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg-primary: #ffffff; --bg-secondary: #f7f7f5; --bg-tertiary: #f0efe9;
    --bg-info: #eff6ff; --bg-success: #f0fdf4;
    --text-primary: #1a1a18; --text-secondary: #6b6b65; --text-tertiary: #9b9b94;
    --text-info: #1d4ed8; --text-success: #15803d;
    --border: rgba(0,0,0,0.12); --border-md: rgba(0,0,0,0.2);
    --radius-md: 8px; --radius-lg: 12px;
    --accent: #4F46E5; --accent-dark: #4338CA; --accent-light: #EEF2FF;
    --danger-bg: #FEF2F2; --danger-text: #991B1B; --danger-border: #FECACA;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-primary: #1c1c1a; --bg-secondary: #252523; --bg-tertiary: #111110;
      --bg-info: #1e2a3a; --bg-success: #1a2e1e;
      --text-primary: #f0ede8; --text-secondary: #a0a099; --text-tertiary: #6b6b65;
      --text-info: #93c5fd; --text-success: #86efac;
      --border: rgba(255,255,255,0.1); --border-md: rgba(255,255,255,0.18);
      --accent-light: #1e1b4b;
      --danger-bg: #2a1414; --danger-text: #fca5a5; --danger-border: #7f1d1d;
    }
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg-tertiary); color: var(--text-primary);
    height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .auth-card {
    width: 100%; max-width: 380px; background: var(--bg-primary);
    border: 0.5px solid var(--border); border-radius: var(--radius-lg);
    padding: 32px 28px; box-shadow: 0 4px 24px rgba(0,0,0,0.06);
  }
  .logo { display: flex; align-items: center; gap: 8px; justify-content: center; margin-bottom: 6px; }
  .logo-icon { width: 32px; height: 32px; background: var(--accent); border-radius: 7px; display: flex; align-items: center; justify-content: center; }
  .logo-icon i { color: #fff; font-size: 17px; }
  .logo-text { font-size: 17px; font-weight: 500; color: var(--text-primary); }
  .auth-subtitle { text-align: center; font-size: 13px; color: var(--text-tertiary); margin-bottom: 26px; }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; }
  .field label { font-size: 12px; color: var(--text-secondary); }
  .field input {
    font-size: 13px; padding: 9px 11px; border-radius: var(--radius-md);
    border: 0.5px solid var(--border-md); background: var(--bg-primary);
    color: var(--text-primary); width: 100%; font-family: inherit;
  }
  .field input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(79,70,229,0.12); }
  .btn-primary {
    width: 100%; padding: 10px; border-radius: var(--radius-md); font-size: 13px;
    cursor: pointer; border: none; background: var(--accent); color: #fff;
    font-weight: 500; margin-top: 6px; display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn-primary:hover:not(:disabled) { background: var(--accent-dark); }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
  .switch-mode { text-align: center; font-size: 12px; color: var(--text-tertiary); margin-top: 18px; }
  .switch-mode a { color: var(--accent); cursor: pointer; font-weight: 500; text-decoration: none; }
  .switch-mode a:hover { text-decoration: underline; }
  .msg { font-size: 12px; padding: 9px 11px; border-radius: var(--radius-md); margin-bottom: 14px; display: none; line-height: 1.5; }
  .msg-error { background: var(--danger-bg); color: var(--danger-text); border: 0.5px solid var(--danger-border); }
  .msg-success { background: var(--bg-success); color: var(--text-success); border: 0.5px solid #bbf7d0; }
  .spinner {
    width: 13px; height: 13px; border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite; flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .config-missing { font-size: 12px; color: var(--danger-text); text-align: center; padding: 14px; }
</style>
</head>
<body>

<div class="auth-card">
  <div style="margin-bottom:14px;">
    <a href="index.html" style="font-size:12px;color:var(--text-tertiary);text-decoration:none;display:inline-flex;align-items:center;gap:4px;">
      <i class="ti ti-arrow-left"></i> Retour à l'accueil
    </a>
  </div>
  <div class="logo">
    <div class="logo-icon"><i class="ti ti-gavel"></i></div>
    <div class="logo-text">LexAI</div>
  </div>
  <div class="auth-subtitle" id="auth-subtitle">Connectez-vous à votre espace</div>

  <div id="config-missing" class="config-missing" style="display:none;">
    Configuration Supabase manquante dans le code de la page.<br>Contactez l'administrateur de l'application.
  </div>

  <form id="auth-form" onsubmit="handleAuth(event)">
    <div class="msg msg-error" id="msg-error"></div>
    <div class="msg msg-success" id="msg-success"></div>

    <div class="field">
      <label>Email</label>
      <input type="email" id="email" placeholder="vous@exemple.fr" required autocomplete="email">
    </div>
    <div class="field">
      <label>Mot de passe</label>
      <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" minlength="6">
    </div>

    <button type="submit" class="btn-primary" id="btn-submit">
      <i class="ti ti-login-2"></i> Se connecter
    </button>
  </form>

  <div class="switch-mode">
    <span id="switch-text">Pas encore de compte ?</span>
    <a id="switch-link" onclick="toggleMode()">Créer un compte</a>
  </div>
  <div class="switch-mode" style="margin-top:8px;">
    <a onclick="handleForgotPassword()">Mot de passe oublié ?</a>
  </div>
</div>

<script>
  // ─── Configuration Supabase (à compléter) ─────────────────────────────
  const SUPABASE_URL = 'https://xxxxxxxxxxxx.supabase.co';
  const SUPABASE_ANON_KEY = 'COLLER_LA_CLE_ANON_ICI';
  // ────────────────────────────────────────────────────────────────────

  let isSignup = false;
  let sb = null;

  if (!SUPABASE_URL.includes('xxxxxxxxxxxx') && !SUPABASE_ANON_KEY.includes('COLLER_LA_CLE')) {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  } else {
    document.getElementById('config-missing').style.display = 'block';
    document.getElementById('auth-form').style.display = 'none';
    document.querySelectorAll('.switch-mode').forEach(el => el.style.display = 'none');
  }

  // Redirige vers l'app si déjà connecté
  window.addEventListener('DOMContentLoaded', async () => {
    if (!sb) return;
    const { data } = await sb.auth.getSession();
    if (data.session) window.location.href = 'app.html';
  });

  function toggleMode() {
    isSignup = !isSignup;
    document.getElementById('auth-subtitle').textContent = isSignup
      ? 'Créez votre espace LexAI' : 'Connectez-vous à votre espace';
    document.getElementById('btn-submit').innerHTML = isSignup
      ? '<i class="ti ti-user-plus"></i> Créer mon compte'
      : '<i class="ti ti-login-2"></i> Se connecter';
    document.getElementById('switch-text').textContent = isSignup
      ? 'Déjà un compte ?' : 'Pas encore de compte ?';
    document.getElementById('switch-link').textContent = isSignup
      ? 'Se connecter' : 'Créer un compte';
    hideMessages();
  }

  function hideMessages() {
    document.getElementById('msg-error').style.display = 'none';
    document.getElementById('msg-success').style.display = 'none';
  }

  function showError(text) {
    const el = document.getElementById('msg-error');
    el.textContent = text;
    el.style.display = 'block';
    document.getElementById('msg-success').style.display = 'none';
  }

  function showSuccess(text) {
    const el = document.getElementById('msg-success');
    el.textContent = text;
    el.style.display = 'block';
    document.getElementById('msg-error').style.display = 'none';
  }

  async function handleAuth(e) {
    e.preventDefault();
    if (!sb) return;
    hideMessages();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('btn-submit');
    const originalHtml = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Patientez…';

    try {
      if (isSignup) {
        const { data, error } = await sb.auth.signUp({ email, password });
        if (error) throw error;
        if (data.session) {
          window.location.href = 'app.html';
        } else {
          showSuccess('Compte créé. Vérifiez votre email pour confirmer votre inscription avant de vous connecter.');
        }
      } else {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
        window.location.href = 'app.html';
      }
    } catch (err) {
      showError(translateAuthError(err.message));
    } finally {
      btn.disabled = false;
      btn.innerHTML = originalHtml;
    }
  }

  async function handleForgotPassword() {
    if (!sb) return;
    const email = document.getElementById('email').value.trim();
    if (!email) { showError('Renseignez votre email ci-dessus, puis cliquez à nouveau sur "Mot de passe oublié".'); return; }
    hideMessages();
    const { error } = await sb.auth.resetPasswordForEmail(email);
    if (error) showError(translateAuthError(error.message));
    else showSuccess('Email de réinitialisation envoyé, si ce compte existe.');
  }

  function translateAuthError(msg) {
    if (/Invalid login credentials/i.test(msg)) return 'Email ou mot de passe incorrect.';
    if (/User already registered/i.test(msg)) return 'Un compte existe déjà avec cet email.';
    if (/Password should be/i.test(msg)) return 'Le mot de passe doit contenir au moins 6 caractères.';
    if (/Unable to validate email/i.test(msg)) return 'Adresse email invalide.';
    return msg;
  }
</script>
</body>
</html>
